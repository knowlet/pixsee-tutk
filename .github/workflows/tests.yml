name: Tests

on:
  push:
    branches: [main, 'codex/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }} / macOS
    runs-on: macos-15-intel
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install local media and DTLS dependencies
        run: brew install openssl@3 ffmpeg
      - name: Install pinned MediaMTX for protocol integration
        run: |
          curl --fail --location --retry 3 \
            https://github.com/bluenviron/mediamtx/releases/download/v1.21.3/mediamtx_v1.21.3_darwin_amd64.tar.gz \
            --output "$RUNNER_TEMP/mediamtx.tar.gz"
          printf '%s  %s\n' '8a8416ee2ff5d17d9366498b6d88b76ab6d3afcda50b6d7321ccddb349bdbaf2' "$RUNNER_TEMP/mediamtx.tar.gz" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/mediamtx.tar.gz" -C "$RUNNER_TEMP" mediamtx
          printf 'PIXSEE_TEST_MEDIAMTX=%s\n' "$RUNNER_TEMP/mediamtx" >> "$GITHUB_ENV"
      - name: Install package
        run: python -m pip install --no-deps .
      - name: Unit and loopback integration tests
        run: python -m unittest discover -s tests -v
      - name: Retained upstream message checks
        run: python cuboai_messages.py
      - name: Installed CLI smoke test
        working-directory: ${{ runner.temp }}
        run: pixsee --help
