name: Tests

on:
  push:
    branches: [main, 'codex/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }} / macOS
    runs-on: macos-14
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install local media and DTLS dependencies
        run: brew install openssl@3 ffmpeg
      - name: Install package
        run: python -m pip install --no-deps .
      - name: Unit and loopback integration tests
        run: python -m unittest discover -s tests -v
      - name: Retained upstream message checks
        run: python cuboai_messages.py
      - name: Installed CLI smoke test
        working-directory: ${{ runner.temp }}
        run: pixsee --help
